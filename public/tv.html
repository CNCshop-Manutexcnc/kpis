<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="1800" />
    <title>KPIs Eletronica</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }
      .head {
        background: #111827;
        border: 1px solid #1f2937;
        border-top: 4px solid #22c55e;
        padding: 16px 20px;
        border-radius: 8px;
      }
      .title {
        margin: 0;
        font-size: 34px;
        color: #f8fafc;
      }
      .sub {
        margin: 8px 0 0;
        color: #94a3b8;
        font-size: 18px;
      }
      .kpi-row {
        margin-top: 14px;
        overflow: hidden;
      }
      .card {
        float: left;
        width: 32%;
        margin-right: 1%;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 14px 16px;
        box-sizing: border-box;
      }
      .kpi-row .card.last {
        margin-right: 0;
      }
      .label {
        font-size: 16px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .value {
        font-size: 52px;
        font-weight: bold;
        margin-top: 10px;
        line-height: 1;
        color: #f8fafc;
      }
      .ok {
        color: #34d399;
      }
      .warn {
        color: #f59e0b;
      }
      .danger {
        color: #f87171;
      }
      .meta {
        margin-top: 16px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 14px 18px;
      }
      .meta-title {
        margin: 0;
        color: #f8fafc;
        font-size: 22px;
      }
      .status-list {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
      }
      .status-list li {
        border: 1px solid #1f2937;
        background: #0b1220;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 20px;
      }
      .status-count {
        float: right;
        font-weight: bold;
        color: #93c5fd;
      }
      .foot {
        margin-top: 12px;
        font-size: 22px;
        color: #cbd5e1;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .err {
        margin-top: 12px;
        background: #3f1d1d;
        border: 1px solid #dc2626;
        color: #fecaca;
        padding: 12px;
        border-radius: 8px;
        display: none;
      }
      .clear {
        clear: both;
      }

      .confetti-layer {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 9999;
      }

      .confetti {
        position: absolute;
        top: -20px;
        width: 10px;
        height: 16px;
        opacity: 0.95;
        -webkit-animation-name: confetti-fall;
        -webkit-animation-timing-function: linear;
        -webkit-animation-fill-mode: forwards;
        animation-name: confetti-fall;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }

      @-webkit-keyframes confetti-fall {
        0% {
          -webkit-transform: translateY(0px) rotate(0deg);
          transform: translateY(0px) rotate(0deg);
          opacity: 1;
        }
        100% {
          -webkit-transform: translateY(110vh) rotate(720deg);
          transform: translateY(110vh) rotate(720deg);
          opacity: 0.1;
        }
      }

      @keyframes confetti-fall {
        0% {
          -webkit-transform: translateY(0px) rotate(0deg);
          transform: translateY(0px) rotate(0deg);
          opacity: 1;
        }
        100% {
          -webkit-transform: translateY(110vh) rotate(720deg);
          transform: translateY(110vh) rotate(720deg);
          opacity: 0.1;
        }
      }

      @media (max-width: 900px) {
        .card {
          float: none;
          width: 100%;
          margin-right: 0;
          margin-bottom: 10px;
        }
        .title {
          font-size: 28px;
        }
        .value {
          font-size: 42px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <h1 class="title">Laboratorio Eletronico</h1>
        <p class="sub">Painel ao vivo para TV</p>
      </div>

      <div class="kpi-row">
        <div class="card">
          <div class="label">Total de OS</div>
          <div id="total" class="value">-</div>
        </div>
        <div class="card">
          <div class="label">Aguardando avaliacao</div>
          <div id="aguardando" class="value warn">-</div>
        </div>
        <div class="card last">
          <div class="label">Meta mensal</div>
          <div id="meta" class="value">-</div>
        </div>
      </div>

      <div class="meta">
        <h2 class="meta-title">Status do laboratorio</h2>
        <ul id="statusList" class="status-list"></ul>
        <div class="clear"></div>
      </div>

      <div id="error" class="err"></div>

      <div id="lastUpdate" class="foot">Ult. atualizacao: -</div>
    </div>

    <div id="confettiLayer" class="confetti-layer"></div>

    <script>
      (function () {
        var SHEET_CSV_URL =
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpza0h0T--mGQ1SdcS4bkHkPjAROf08dyweBAxJ1tACGGBH2EqGZsez4UUuDLCFNTdQ8J5ehpWIB9s/pub?output=csv";

        var META_CSV_URL =
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpza0h0T--mGQ1SdcS4bkHkPjAROf08dyweBAxJ1tACGGBH2EqGZsez4UUuDLCFNTdQ8J5ehpWIB9s/pub?gid=151603371&single=true&output=csv";

        var confettiTimer = null;
        var confettiPhysicsTimer = null;
        var confettiPieces = [];
        var confettiColors = ["#22c55e", "#38bdf8", "#f59e0b", "#f43f5e", "#a78bfa", "#f8fafc"];

        function getViewportWidth() {
          return window.innerWidth || document.documentElement.clientWidth || 1280;
        }

        function getViewportHeight() {
          return window.innerHeight || document.documentElement.clientHeight || 720;
        }

        function parseCSVLine(line) {
          var result = [];
          var current = "";
          var inQuotes = false;
          var i;
          for (i = 0; i < line.length; i++) {
            var ch = line.charAt(i);
            if (inQuotes) {
              if (ch === '"' && line.charAt(i + 1) === '"') {
                current += '"';
                i++;
              } else if (ch === '"') {
                inQuotes = false;
              } else {
                current += ch;
              }
            } else {
              if (ch === '"') {
                inQuotes = true;
              } else if (ch === ',') {
                result.push(trim(current));
                current = "";
              } else {
                current += ch;
              }
            }
          }
          result.push(trim(current));
          return result;
        }

        function trim(s) {
          return (s || "").replace(/^\s+|\s+$/g, "");
        }

        function parseNumber(str) {
          var normalized = (str || "0").replace(/\./g, "").replace(",", ".");
          var n = parseFloat(normalized);
          return isNaN(n) ? 0 : n;
        }

        function setText(id, value) {
          var el = document.getElementById(id);
          if (el) el.innerHTML = value;
        }

        function setMetaColor(perc) {
          var el = document.getElementById("meta");
          if (!el) return;
          el.className = "value";
          if (perc >= 80) {
            el.className += " ok";
          } else if (perc >= 50) {
            el.className += " warn";
          } else {
            el.className += " danger";
          }
        }

        function spawnConfettiBurst() {
          var layer = document.getElementById("confettiLayer");
          if (!layer) return;
          var width = getViewportWidth();

          var i;
          for (i = 0; i < 42; i++) {
            var piece = document.createElement("div");
            var leftPx = Math.floor(Math.random() * width);
            var size = 8 + Math.floor(Math.random() * 8);
            var color = confettiColors[Math.floor(Math.random() * confettiColors.length)];

            piece.className = "confetti";
            piece.style.left = leftPx + "px";
            piece.style.top = "-20px";
            piece.style.width = size + "px";
            piece.style.height = Math.floor(size * 1.5) + "px";
            piece.style.background = color;

            layer.appendChild(piece);

            confettiPieces.push({
              el: piece,
              x: leftPx,
              y: -20,
              vx: -1.5 + Math.random() * 3,
              vy: 2 + Math.random() * 3,
              life: 0,
              maxLife: 180 + Math.floor(Math.random() * 120),
            });
          }
        }

        function tickConfetti() {
          var i;
          var p;
          var maxY = getViewportHeight() + 30;

          for (i = confettiPieces.length - 1; i >= 0; i--) {
            p = confettiPieces[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.04;
            p.life += 1;

            if (p.el) {
              p.el.style.left = Math.round(p.x) + "px";
              p.el.style.top = Math.round(p.y) + "px";
            }

            if (p.y > maxY || p.life > p.maxLife) {
              if (p.el && p.el.parentNode) {
                p.el.parentNode.removeChild(p.el);
              }
              confettiPieces.splice(i, 1);
            }
          }
        }

        function startConfetti() {
          if (confettiTimer) return;
          spawnConfettiBurst();
          confettiTimer = setInterval(spawnConfettiBurst, 450);
          if (!confettiPhysicsTimer) {
            confettiPhysicsTimer = setInterval(tickConfetti, 30);
          }
        }

        function stopConfetti() {
          var layer;
          if (confettiTimer) {
            clearInterval(confettiTimer);
            confettiTimer = null;
          }
          if (confettiPhysicsTimer) {
            clearInterval(confettiPhysicsTimer);
            confettiPhysicsTimer = null;
          }
          confettiPieces = [];
          layer = document.getElementById("confettiLayer");
          if (layer) {
            layer.innerHTML = "";
          }
        }

        function setError(msg) {
          var el = document.getElementById("error");
          if (!el) return;
          if (msg) {
            el.style.display = "block";
            el.innerHTML = msg;
          } else {
            el.style.display = "none";
            el.innerHTML = "";
          }
        }

        function xhrGet(url, onOk, onErr) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              onOk(xhr.responseText || "");
            } else {
              onErr("Falha ao carregar dados. HTTP " + xhr.status);
            }
          };
          xhr.onerror = function () {
            onErr("Falha de rede ao carregar dados da planilha.");
          };
          xhr.send();
        }

        function updateLastUpdate() {
          var now = new Date();
          var hh = ("0" + now.getHours()).slice(-2);
          var mm = ("0" + now.getMinutes()).slice(-2);
          setText("lastUpdate", "Ult. atualizacao: " + hh + ":" + mm);
        }

        function renderStatus(groups) {
          var entries = [];
          var key;
          for (key in groups) {
            if (groups.hasOwnProperty(key)) {
              entries.push({ name: key, value: groups[key] });
            }
          }

          entries.sort(function (a, b) {
            return b.value - a.value;
          });

          var html = "";
          var i;
          for (i = 0; i < entries.length; i++) {
            html +=
              "<li>" +
              entries[i].name +
              '<span class="status-count">' +
              entries[i].value +
              "</span></li>";
          }

          if (!html) html = "<li>Sem dados</li>";
          setText("statusList", html);
        }

        function loadOS(next) {
          xhrGet(
            SHEET_CSV_URL,
            function (text) {
              var lines = text.split("\n");
              var data = [];
              var i;

              for (i = 1; i < lines.length; i++) {
                if (trim(lines[i]) === "") continue;
                var cols = parseCSVLine(lines[i]);
                data.push({
                  statusLab: cols[2] || "",
                });
              }

              var total = data.length;
              var aguardando = 0;
              var groups = {};

              for (i = 0; i < data.length; i++) {
                var s = data[i].statusLab || "SEM STATUS";
                if (s.indexOf("AGUARDANDO") >= 0) aguardando++;
                groups[s] = (groups[s] || 0) + 1;
              }

              setText("total", String(total));
              setText("aguardando", String(aguardando));
              renderStatus(groups);
              next();
            },
            function (err) {
              setError(err);
              next();
            }
          );
        }

        function loadMeta(done) {
          xhrGet(
            META_CSV_URL,
            function (text) {
              var lines = text.split("\n");
              if (lines.length < 2) {
                setText("meta", "0%");
                done();
                return;
              }

              var cols = parseCSVLine(lines[1]);
              var meta = parseNumber(cols[0]);
              var atual = parseNumber(cols[1]);
              var reachedGoal = meta > 0 && atual >= meta;
              var perc = 0;
              if (meta > 0) {
                perc = Math.round((atual / meta) * 100);
              }
              if (perc > 100) {
                perc = 100;
              }
              if (perc < 0) {
                perc = 0;
              }

              if (reachedGoal) {
                startConfetti();
              } else {
                stopConfetti();
              }

              setMetaColor(perc);
              setText("meta", perc + "%");
              done();
            },
            function (err) {
              setError(err);
              done();
            }
          );
        }

        function refreshAll() {
          setError("");
          loadOS(function () {
            loadMeta(function () {
              updateLastUpdate();
            });
          });
        }

        refreshAll();
        setInterval(refreshAll, 5 * 60 * 1000);
      })();
    </script>
  </body>
</html>
