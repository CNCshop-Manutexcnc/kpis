name: auto-merge-release-please

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge-pr-event:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.user.login == 'release-please[bot]') &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for this Release Please PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNodeId = context.payload.pull_request.node_id;
            const methods = ["SQUASH", "MERGE", "REBASE"];

            for (const mergeMethod of methods) {
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: prNodeId, mergeMethod }
                );
                core.info(`Auto-merge enabled for PR #${context.payload.pull_request.number} using ${mergeMethod}.`);
                return;
              } catch (error) {
                core.warning(`Method ${mergeMethod} failed: ${error.message}`);
              }
            }

            core.setFailed("Could not enable auto-merge with any merge method.");

  enable-automerge-sweep:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for open Release Please PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const candidates = prs.filter((pr) => {
              const byBot = pr.user?.login === "github-actions[bot]" || pr.user?.login === "release-please[bot]";
              const hasPendingLabel = (pr.labels || []).some((l) => l.name === "autorelease: pending");
              const looksLikeReleasePlease = (pr.title || "").toLowerCase().startsWith("chore(main): release");
              return byBot && hasPendingLabel && looksLikeReleasePlease;
            });

            if (candidates.length === 0) {
              core.info("No open Release Please PRs found for auto-merge.");
              return;
            }

            for (const pr of candidates) {
              const methods = ["SQUASH", "MERGE", "REBASE"];
              let enabled = false;

              for (const mergeMethod of methods) {
                try {
                  await github.graphql(
                    `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                      enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                        pullRequest { number }
                      }
                    }`,
                    { pullRequestId: pr.node_id, mergeMethod }
                  );
                  core.info(`Auto-merge enabled for PR #${pr.number} with ${mergeMethod}.`);
                  enabled = true;
                  break;
                } catch (error) {
                  core.warning(`PR #${pr.number} failed with ${mergeMethod}: ${error.message}`);
                }
              }

              if (!enabled) {
                core.warning(`Could not enable auto-merge for PR #${pr.number}.`);
              }
            }
