name: auto-merge-release-please

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge-pr-event:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.user.login == 'release-please[bot]') &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - name: Merge this Release Please PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: "squash",
              });
              core.info(`Release Please PR #${pull_number} merged successfully.`);
            } catch (error) {
              core.setFailed(`Could not merge Release Please PR #${pull_number}: ${error.message}`);
            }

  enable-automerge-sweep:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Merge open Release Please PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const candidates = prs.filter((pr) => {
              const byBot = pr.user?.login === "github-actions[bot]" || pr.user?.login === "release-please[bot]";
              const hasPendingLabel = (pr.labels || []).some((l) => l.name === "autorelease: pending");
              const looksLikeReleasePlease = (pr.title || "").toLowerCase().startsWith("chore(main): release");
              return byBot && hasPendingLabel && looksLikeReleasePlease;
            });

            if (candidates.length === 0) {
              core.info("No open Release Please PRs found for auto-merge.");
              return;
            }

            for (const pr of candidates) {
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: "squash",
                });
                core.info(`Release Please PR #${pr.number} merged successfully.`);
              } catch (error) {
                core.warning(`Could not merge PR #${pr.number}: ${error.message}`);
              }
            }
